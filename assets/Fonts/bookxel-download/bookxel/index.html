<!DOCTYPE html>
<html lang="en">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bookxel WOFF2 Specimen</title>
<style>

:root {
    --bg: #e0e0e0;
    --container-bg: #fff;
    --fg: #111;
    --fg-muted: #888;
    --accent: #007a1f;
    --border: #ccc;
    --control-bg: #d0d0d0;
    
    --font-name: 'Bookxel';
    --dynamic-size: 32px; 
    --dynamic-tracking: 0px;
    --dynamic-align: left;
}

:root.dark-mode {
    --bg: #0a0a0a;
    --container-bg: #000;
    --fg: #f0f0f0;
    --fg-muted: #666;
    --accent: #00ff41;
    --border: #222;
    --control-bg: #1a1a1a;
}

@font-face {
    font-family: 'Bookxel';
    src: url('bookxel.woff2') format('woff2');
    font-weight: normal;
    font-style: normal;
    font-display: block;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
    background: var(--bg);
    color: var(--fg);
    padding: 2rem;
    font-family: system-ui, -apple-system, sans-serif;
    image-rendering: pixelated;
    -webkit-font-smoothing: none;
    -moz-osx-font-smoothing: grayscale;
    text-rendering: optimizeSpeed;
    transition: background 0.2s, color 0.2s;
}

main { max-width: 800px; margin: 0 auto; }

header { margin-bottom: 2rem; }
h1 { font-family: 'Bookxel'; font-size: 32px; color: var(--accent); margin-bottom: 0.5rem; }

.controls {
    background: var(--control-bg);
    padding: 1.5rem;
    border-radius: 4px;
    margin-bottom: 2rem;
    display: flex;
    flex-direction: column;
    gap: 1.2rem;
}

.control-group { display: flex; flex-direction: column; gap: 0.5rem; }
.slider-wrap { display: flex; align-items: center; gap: 1rem; }
input[type="range"] { flex-grow: 1; accent-color: var(--accent); }

.presets, .toggles { display: flex; gap: 0.5rem; flex-wrap: wrap; }

button {
    background: var(--bg);
    color: var(--fg);
    border: 1px solid var(--border);
    padding: 0.4rem 0.8rem;
    cursor: pointer;
    font-size: 11px;
    border-radius: 2px;
    text-transform: uppercase;
}
button.active { border-color: var(--accent); color: var(--accent); }

.preview-container {
    border: 1px solid var(--border);
    background: var(--container-bg);
    padding: 2.5rem;
    min-height: 300px;
    position: relative;
    overflow: auto;
}

.pixel-font {
    font-family: var(--font-name), monospace;
    font-size: var(--dynamic-size);
    letter-spacing: var(--dynamic-tracking);
    text-align: var(--dynamic-align);
    line-height: 1.2; 
    outline: none;
    min-height: 200px;
    display: block;
}

.status-bar { height: 20px; margin-top: 0.5rem; }
.warning-text { color: #ff4444; font-size: 11px; visibility: hidden; }

.meta-footer {
    margin-top: 1.5rem;
    font-size: 11px;
    color: var(--fg-muted);
    display: flex;
    justify-content: space-between;
    border-top: 1px solid var(--border);
    padding-top: 0.5rem;
}

</style>

<main id="app">
    <header>
        <h1>BOOKXEL LAB</h1>
        <p style="font-size: 14px; color: var(--fg-muted);">Dynamic WOFF2 Integrity Specimen</p>
    </header>

    <section class="controls">
        <!-- Size Control -->
        <div class="control-group">
            <div class="slider-wrap">
                <label style="width: 100px; font-size: 12px;">Size: <span id="sizeVal">32</span>px</label>
                <input type="range" id="sizeSlider" min="8" max="160" value="32">
            </div>
            <div class="presets">
                <button onclick="updateSize(16)">16px</button>
                <button onclick="updateSize(24)" style="color:#ff4444">24px</button>
                <button onclick="updateSize(32)">32px</button>
                <button onclick="updateSize(48)">48px</button>
                <button onclick="updateSize(64)">64px</button>
            </div>
        </div>

        <!-- Spacing Control -->
        <div class="control-group">
            <div class="slider-wrap">
                <label style="width: 100px; font-size: 12px;">Spacing: <span id="trackVal">0</span>px</label>
                <input type="range" id="trackSlider" min="-10" max="40" value="0">
            </div>
        </div>

        <div class="toggles">
            <button id="themeToggle" onclick="toggleTheme()">Dark/Light</button>
            <span style="flex-grow: 1;"></span>
            <button onclick="updateAlign('left')">Left</button>
            <button onclick="updateAlign('center')">Center</button>
        </div>
        
        <div class="status-bar">
            <div id="blurWarning" class="warning-text">⚠ NON-INTEGER MULTIPLE DETECTED. FONT WILL BLUR.</div>
        </div>
    </section>

    <section id="preview" class="preview-container">
        <div id="output" class="pixel-font" contenteditable="true" spellcheck="false">
            THE QUICK BROWN FOX JUMPS OVER THE LAZY DOG.<br>
            the quick brown fox jumps over the lazy dog.<br>
            0123456789 !@#$%^&*()
        </div>
    </section>

    <div class="meta-footer">
        <div>Scale: <span id="remVal">2.000rem</span></div>
        <div>Text is Editable</div>
    </div>
</main>

<script type="module">
    const slider = document.getElementById('sizeSlider');
    const trackSlider = document.getElementById('trackSlider');
    const sizeVal = document.getElementById('sizeVal');
    const trackVal = document.getElementById('trackVal');
    const remVal = document.getElementById('remVal');
    const blurWarning = document.getElementById('blurWarning');
    const root = document.documentElement;

    window.updateSize = (val) => {
        slider.value = val;
        applySize(val);
    };

    window.updateAlign = (val) => {
        root.style.setProperty('--dynamic-align', val);
    };

    window.toggleTheme = () => {
        root.classList.toggle('dark-mode');
    };

    function applySize(val) {
        const num = parseInt(val);
        sizeVal.innerText = num;
        remVal.innerText = (num / 16).toFixed(3) + 'rem';
        root.style.setProperty('--dynamic-size', num + 'px');
        blurWarning.style.visibility = (num % 16 !== 0) ? 'visible' : 'hidden';
    }

    function applyTracking(val) {
        const num = parseInt(val);
        trackVal.innerText = num;
        root.style.setProperty('--dynamic-tracking', num + 'px');
    }

    slider.addEventListener('input', (e) => applySize(e.target.value));
    trackSlider.addEventListener('input', (e) => applyTracking(e.target.value));

    applySize(32);
    applyTracking(0);
</script>
